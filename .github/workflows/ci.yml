# The same `npm run verify` as on the laptop (D127, D129), on GitHub-hosted runners,
# plus the program: built at the pins, its IDL checked against the committed one, and its tests run (C3).
# main's protection requires both jobs to pass before a pull request can merge (D128).
# On main, once both pass, the backend deploys to Fly.io and the website to Cloudflare Pages, then the smoke test
# checks all three deployed parts: the program's Config, and the backend and website at the commit just deployed
# (P17, P26, P27, D132).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push cancels a branch's older run, but never main's: that could stop a deploy halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium for the website's browser tests (D116)
        run: npx playwright install --with-deps chromium
      - run: npm run verify

  program:
    name: program
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Solana's system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libudev-dev llvm libclang-dev protobuf-compiler libssl-dev
      - name: Restore the toolchain and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/meridian-toolchain
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cache/solana
            target
          key: program-${{ runner.os }}-${{ hashFiles('scripts/toolchain/pins.sh', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: program-${{ runner.os }}-
      - name: The toolchain at the pins
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          bash scripts/toolchain/install.sh
      - name: Build, and check the committed IDL
        run: bash scripts/program/build.sh --check
      - name: Program tests (LiteSVM)
        run: cargo test -p meridian

  deploy-backend:
    name: deploy backend
    needs: [verify, program]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: flyctl at its pin, refused unless its SHA-256 matches pins.sh (P22)
        run: |
          . scripts/toolchain/pins.sh
          curl -fsSL -o /tmp/flyctl.tar.gz "https://github.com/superfly/flyctl/releases/download/v$FLYCTL/flyctl_${FLYCTL}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  /tmp/flyctl.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/flyctl.tar.gz -C "$HOME/.local/bin" flyctl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy, with a token that reaches this one app (P17)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy . --config apps/backend/fly.toml --dockerfile apps/backend/Dockerfile --remote-only --build-arg GIT_COMMIT=${{ github.sha }}

  deploy-website:
    name: deploy website
    needs: [verify, program]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build, with the commit in the page (D132)
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build -w apps/web
      # wrangler's dependencies aren't locked, so they install in a step that holds no secrets (P27).
      - name: wrangler at its pin, installed without the Cloudflare token in reach
        run: |
          . scripts/toolchain/pins.sh
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund "wrangler@$WRANGLER"
      - name: Deploy to Cloudflare Pages by direct upload (P17)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler() { "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" "$@"; }
          # The first run creates the project; later runs accept only its "already exists" error.
          if ! out=$(wrangler pages project create meridian-devnet --production-branch main 2>&1); then
            echo "$out" | grep -qi 'already exists' || { echo "$out"; exit 1; }
          fi
          wrangler pages deploy apps/web/dist --project-name meridian-devnet --branch main --commit-hash ${{ github.sha }}

  smoke:
    name: smoke
    needs: [deploy-backend, deploy-website]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Each part is checked even if an earlier one failed; the job fails if any did.
      - name: The program's Config on devnet
        run: node scripts/smoke/program.mjs
      - name: The backend, at this commit (D132)
        if: ${{ !cancelled() }}
        run: node scripts/smoke/backend.mjs https://meridian-devnet-backend.fly.dev ${{ github.sha }}
      - name: The website, at this commit, in a real browser
        if: ${{ !cancelled() }}
        run: node scripts/smoke/website.mjs https://meridian-devnet-2qv.pages.dev ${{ github.sha }}
