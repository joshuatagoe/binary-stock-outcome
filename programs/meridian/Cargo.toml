[package]
name = "meridian"
version = "0.1.0"
description = "Meridian: binary stock-outcome contracts on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
# The devnet build refuses mainnet USDC (D32). A mainnet build would turn this off.
default = ["devnet"]
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"

[dev-dependencies]
litesvm = "=0.16.0"
litesvm-loader = "=0.16.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
