[package]
name = "meridian"
version = "0.1.0"
description = "Meridian: binary stock-outcome contracts on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
# The devnet build refuses mainnet USDC (D32). A mainnet build would turn this off.
default = ["devnet"]
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# event-cpi: events written through a call to the program itself, harder to lose than log lines (D62).
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
# Anchor's zero-copy accounts (the book, D107) need bytemuck by name; the version Anchor already locks.
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
spl-token-2022-interface = "=3.1.2"
# The token name's instruction builder (D108); the version spl-token-2022-interface already locks.
spl-token-metadata-interface = "=1.0.1"

[dev-dependencies]
litesvm = "=0.16.0"
litesvm-loader = "=0.16.0"
mollusk-svm = "=0.15.1"
solana-account = "=4.3.2"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
